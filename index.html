<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1d3a"><title>Globe Unlocked – Geography Trivia</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(160deg,#0b1d3a,#123e6b 60%,#1b6b8f);color:#fff;min-height:100vh}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:12px 14px;background:rgba(11,29,58,.85);backdrop-filter:blur(8px)}
header h1{font-size:18px;margin:0;flex:1}.ib{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:12px;min-width:44px;height:44px;font-size:20px}
main{padding:14px;max-width:560px;margin:auto}.bar{height:10px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd166,#06d6a0);transition:width .6s}
.big{font-size:28px;font-weight:800;margin:6px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.card{border:0;color:#fff;text-align:left;border-radius:18px;padding:16px;min-height:120px;font-size:17px;font-weight:700;position:relative;box-shadow:0 6px 18px rgba(0,0,0,.25);transition:transform .15s;animation:pop .35s both}
.card:active{transform:scale(.96)}.card small{display:block;font-weight:500;opacity:.9;margin:6px 0 10px}.card .e{font-size:34px}
@keyframes pop{from{opacity:0;transform:translateY(12px)}}
.clist{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.cty{background:rgba(255,255,255,.1);border:2px solid transparent;border-radius:14px;color:#fff;padding:10px 4px;font-size:12px;min-height:96px;animation:pop .3s both}
.cty img{width:56px;height:38px;object-fit:cover;border-radius:4px;display:block;margin:0 auto 6px;filter:grayscale(1) brightness(.6)}.cty.done{border-color:#06d6a0;background:rgba(6,214,160,.18)}.cty.done img{filter:none}
.q{font-size:21px;font-weight:700;margin:16px 0}.flagq{width:100%;max-height:180px;object-fit:contain;border-radius:8px;background:#fff1;margin:6px 0}
.opt{display:block;width:100%;min-height:58px;margin:10px 0;border-radius:14px;border:0;background:#fff;color:#0b1d3a;font-size:17px;font-weight:600;padding:12px;text-align:left;transition:.2s}
.opt.ok{background:#06d6a0;color:#fff;animation:bump .4s}.opt.no{background:#ef476f;color:#fff;animation:shake .4s}.opt:disabled{opacity:1}
@keyframes bump{50%{transform:scale(1.04)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fact{background:rgba(255,255,255,.12);border-radius:14px;padding:12px;margin-top:8px;animation:pop .3s}.next{width:100%;height:56px;border-radius:14px;border:0;background:#ffd166;color:#0b1d3a;font-size:18px;font-weight:800;margin-top:12px}
.rand{display:block;width:100%;min-height:64px;margin-top:14px;border:0;border-radius:16px;background:#ffd166;color:#0b1d3a;font-size:18px;font-weight:800;padding:12px 16px;box-shadow:0 6px 18px rgba(0,0,0,.25);text-align:center}
.rand small{display:block;font-weight:600;font-size:13px;margin-top:4px;opacity:.75}
.rand:active{transform:scale(.98)}
.mapbtn{display:block;width:100%;min-height:64px;margin-top:10px;border:0;border-radius:16px;background:rgba(255,255,255,.14);color:#fff;font-size:18px;font-weight:800;padding:12px 16px;box-shadow:0 6px 18px rgba(0,0,0,.25);text-align:center}
.mapbtn small{display:block;font-weight:600;font-size:13px;margin-top:4px;opacity:.8}
.mapbtn:active{transform:scale(.98)}
.seg{display:flex;gap:8px;margin-top:12px}.seg button{flex:1;min-height:48px;border:0;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-size:16px;font-weight:800}
.seg button.on{background:#ffd166;color:#0b1d3a}
.mapwrap{position:relative;height:max(340px,calc(100dvh - 300px));margin-top:10px;background:#0e3a5c;border-radius:18px;overflow:hidden;touch-action:none;user-select:none;overscroll-behavior:none}
.mapwrap.tall{width:calc(100% + 28px);margin-left:-14px;border-radius:0;height:auto;aspect-ratio:1.55/1;max-height:calc(100dvh - 148px)}
.mapwrap svg{width:100%;height:100%;display:block;touch-action:none}
.mapwrap path[data-id],.mapwrap .pin,.pin-hit{cursor:pointer;pointer-events:all}
.mapwrap path{vector-effect:non-scaling-stroke}
.pin-hit{fill:transparent}
.zoombar{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:8px;z-index:2}
.mapwrap.tall .zoombar{flex-direction:row}
.zoombar button{width:48px;height:48px;border:0;border-radius:14px;background:#ffd166;color:#0b1d3a;font-size:22px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.mapwrap.tall .zoombar button{width:42px;height:42px}
.mapnote{font-size:13px;opacity:.85;margin:8px 2px 0;line-height:1.4}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin:0 4px 0 0;vertical-align:-1px}
.sw.lock{background:#8d99ab}.sw.open{background:#06d6a0;margin-left:10px}
.levels{display:flex;gap:8px;margin-top:12px}.levels button{flex:1;min-height:52px;border:0;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-size:15px;font-weight:800}
.levels button.on{background:#ffd166;color:#0b1d3a}
.levels button small{display:block;font-weight:600;font-size:11px;opacity:.75}
.badge{display:inline-block;margin-left:4px;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:800;vertical-align:1px}
.badge.easy{background:#8ecae6;color:#0b1d3a}.badge.medium{background:#ffd166;color:#0b1d3a}.badge.hard{background:#ef476f;color:#fff}
.pickbar{position:absolute;left:10px;right:10px;top:10px;z-index:3;display:flex;align-items:center;gap:8px;background:rgba(11,29,58,.94);border-radius:14px;padding:8px 8px 8px 12px}
.pickbar[hidden]{display:none}.pickbar>div{flex:1;min-width:0}.pickbar strong{display:block;font-size:16px;line-height:1.2}.pickbar small{display:block;opacity:.8;font-size:12px}
.pickgo{min-height:48px;border:0;border-radius:12px;background:#ffd166;color:#0b1d3a;font-weight:800;padding:0 14px}
.hoverlab{position:absolute;left:10px;top:10px;z-index:3;background:rgba(11,29,58,.9);border-radius:10px;padding:6px 10px;font-weight:800;pointer-events:none}
.hoverlab[hidden]{display:none}
.pin.on circle:last-of-type{stroke:#ffd166;stroke-width:3}
.minimap{height:156px;margin:8px 0;background:#0e3a5c;border-radius:14px;overflow:hidden;touch-action:none}
.minimap svg{width:100%;height:100%;display:block}
.flaggrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.flagopt{min-height:92px;display:flex;align-items:center;justify-content:center;padding:8px}
.flagopt img{width:100%;height:68px;object-fit:contain;pointer-events:none}
.noflag{color:#0b1d3a;font-weight:800;text-align:center;line-height:1.25}
.row{display:flex;justify-content:space-between;font-size:14px;opacity:.9}.streak{color:#ffd166;font-weight:800}
.center{text-align:center;padding-top:30px}.conf{position:fixed;top:-10px;width:10px;height:14px;animation:fall linear forwards;z-index:50}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#06d6a0;padding:12px 18px;border-radius:14px;font-weight:700;animation:pop .3s;z-index:40}
.link{background:none;border:0;color:#fff9;text-decoration:underline;margin-top:30px;font-size:14px;padding:12px}
</style></head><body><header><button class="ib" id="back" aria-label="Back">←</button><h1 id="title">🌍 Globe Unlocked</h1><button class="ib" id="snd" aria-label="Sound">🔊</button></header><main id="app"></main>
<script src="data.js"></script><script src="map/lib.js"></script><script src="map/view.js"></script><script>
const CONT=[["Africa","🦁","#e76f51"],["Asia","🏯","#d62828"],["Europe","🏰","#3a86ff"],["North America","🗽","#8338ec"],["South America","🦜","#2a9d8f"],["Oceania","🐨","#f4a261"],["Antarctica","🐧","#5e81ac"]];
const PASS=0.8,KEY='geoTriviaV1';let S;try{S=JSON.parse(localStorage.getItem(KEY)||'{"done":{},"sound":true,"best":0}');}catch(e){S=null;}
if(!S||typeof S!=='object')S={done:{},sound:true,best:0};
if(!S.done||typeof S.done!=='object')S.done={};
if(typeof S.best!=='number'||!isFinite(S.best))S.best=0;
if(typeof S.sound!=='boolean')S.sound=true;
if(S.level!=='easy'&&S.level!=='medium'&&S.level!=='hard')S.level='medium';
const RANK={easy:1,medium:2,hard:3};
function rank(id){const v=S.done[id];if(v===1)return 'medium';return RANK[v]?v:'';}
function passed(id){return !!rank(id);}
function notePass(id){const cur=rank(id)==='medium'&&S.done[id]===1?2:(RANK[rank(id)]||0);const next=RANK[S.level]||2;if(next>=cur)S.done[id]=S.level;}
function badge(id){const r=rank(id);return r?`<span class="badge ${r}">${r==='easy'?'Easy':r==='medium'?'Med':'Hard'}</span>`:'';}
function qsFor(C){if(C&&C.q&&!Array.isArray(C.q))return C.q[S.level]||C.q.medium||[];return Array.isArray(C&&C.q)?C.q:[];}
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));const app=document.getElementById('app');const $t=document.getElementById('title');
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let AC;function beep(ok){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
 const t=AC.currentTime;o.frequency.setValueAtTime(ok?660:200,t);if(ok)o.frequency.setValueAtTime(880,t+.08);g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3)}catch(e){}}
const snd=document.getElementById('snd');const ss=()=>snd.textContent=S.sound?'🔊':'🔇';ss();snd.onclick=()=>{S.sound=!S.sound;save();ss()};
let stack=[];document.getElementById('back').onclick=()=>{stack.pop();const prev=stack.pop()||home;stack.push(prev);prev()};
const go=f=>{stack.push(f);f()};const inC=c=>GEO.filter(x=>x.cont==c);const nDone=l=>l.filter(x=>passed(x.id)).length;
function toast(msg){document.querySelectorAll('.toast').forEach(el=>el.remove());const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function pickRandom(list){const locked=list.filter(x=>!passed(x.id));const pool=locked.length?locked:list;return {c:pool[Math.floor(Math.random()*pool.length)],replay:!locked.length}}
function launchRandom(list){if(!list||!list.length)return;const pick=pickRandom(list);if(pick.replay)toast('All unlocked. Replaying '+pick.c.name+'.');go(()=>quiz(pick.c.id))}
function home(){stack=[home];$t.textContent='🌍 Globe Unlocked';const d=nDone(GEO);
 if(d==GEO.length)return win();
 app.innerHTML=`<div class="row"><span>Countries unlocked</span><span>${Math.round(d/GEO.length*100)}%</span></div><div class="big" id="overall">${d} / ${GEO.length}</div><div class="bar"><i style="width:${d/GEO.length*100}%"></i></div>
 <div class="levels" id="levels"><button type="button" data-l="easy">Easy<small>Landmarks and famous facts</small></button><button type="button" data-l="medium">Medium<small>The main quiz</small></button><button type="button" data-l="hard">Hard<small>Deeper history and culture</small></button></div>
 <button type="button" class="rand" id="rand-world">🎲 Random Country (anywhere)<small>Quiz a country you have not unlocked yet</small></button>
 <button type="button" class="mapbtn" id="open-map">🗺️ World map<small>Tap a country to quiz it</small></button>
 <div class="grid">${CONT.map(([n,e,col],i)=>{const l=inC(n),k=nDone(l);return `<button class="card" data-c="${n}" style="background:linear-gradient(140deg,${col},${col}aa);animation-delay:${i*50}ms"><span class="e">${e}</span><br>${n}${n=='Antarctica'?' ⭐':''}<small>${k}/${l.length} unlocked${k==l.length?' ✅':''}</small><div class="bar"><i style="width:${k/l.length*100}%"></i></div></button>`}).join('')}</div>
 <div class="center"><button class="link" id="reset">Reset progress</button></div>`;
 app.querySelectorAll('.card').forEach(b=>b.onclick=()=>go(()=>continent(b.dataset.c)));
 document.querySelectorAll('#levels button').forEach(b=>{if(b.dataset.l===S.level)b.classList.add('on');b.onclick=()=>{S.level=b.dataset.l;save();home()}});
 document.getElementById('rand-world').onclick=()=>launchRandom(GEO);
 document.getElementById('open-map').onclick=()=>go(worldMap);
 document.getElementById('reset').onclick=()=>{if(confirm('Reset all progress?')){S.done={};save();home()}}}
const mapColors={};CONT.forEach(([n,,col])=>mapColors[n]=col);
let continentMode='map';
function worldMap(){$t.textContent='🗺️ World map';app.innerHTML='<div id="mapslot"></div>';
 GeoMap.mount({slot:document.getElementById('mapslot'),continent:null,countries:GEO,done:S.done,colors:mapColors,rank,tall:true,onPick:id=>go(()=>quiz(id)),onFail:()=>toast('Map could not load. Pick a continent list instead.')})}
function continent(c){const l=inC(c).sort((a,b)=>a.name.localeCompare(b.name));$t.textContent=c;const k=nDone(l);
 const sub=k<l.length?'Quiz a country still locked on this continent':'All unlocked here. Tap to replay one';
 const list=continentMode==='list'?`<div class="clist">${l.map((x,i)=>`<button class="cty ${passed(x.id)?'done':''}" data-id="${x.id}" style="animation-delay:${Math.min(i*15,400)}ms">${x.id=='ATA'?`<div style="font-size:34px">🐧</div>`:`<img src="flags/${x.id.toLowerCase()}.svg" alt="" loading="lazy">`}${passed(x.id)?'✅ ':'🔒 '}${x.name}${badge(x.id)}</button>`).join('')}</div>`:'';
 app.innerHTML=`<div class="row"><span>${k}/${l.length} unlocked</span></div><div class="bar"><i style="width:${k/l.length*100}%"></i></div><button type="button" class="rand" id="rand-cont">🎲 Random Country<small>${sub}</small></button><div class="seg"><button type="button" id="mode-map" class="${continentMode==='map'?'on':''}">Map</button><button type="button" id="mode-list" class="${continentMode==='list'?'on':''}">List</button></div><div id="mapslot"></div>${list}`;
 document.getElementById('rand-cont').onclick=()=>launchRandom(l);
 document.getElementById('mode-map').onclick=()=>{if(continentMode!=='map'){continentMode='map';continent(c)}};
 document.getElementById('mode-list').onclick=()=>{if(continentMode!=='list'){continentMode='list';continent(c)}};
 if(continentMode==='map')GeoMap.mount({slot:document.getElementById('mapslot'),continent:c,countries:l,done:S.done,colors:mapColors,rank,onPick:id=>go(()=>quiz(id)),onFail:()=>{continentMode='list';toast('Map could not load. Showing the list.');continent(c)}});
 else app.querySelectorAll('.cty').forEach(b=>b.onclick=()=>go(()=>quiz(b.dataset.id)))}
function quiz(id){const C=GEO.find(x=>x.id==id);const bank=qsFor(C);if(!C||!bank.length){toast('That country is not on this globe.');return home()}$t.textContent=C.name;const qs=sh(bank);let i=0,right=0,streak=0;
 const lvl=S.level.charAt(0).toUpperCase()+S.level.slice(1);
 const show=()=>{const q=qs[i];const flagQ=q.kind==='flag';
  app.innerHTML=`<div class="row"><span>${lvl} · ${i+1}/${qs.length}</span><span class="streak">${streak>1?'🔥 '+streak+' streak':''}</span></div><div class="bar"><i style="width:${i/qs.length*100}%"></i></div>
  ${flagQ?'<div class="minimap" id="minimap"></div>':''}${q.flag?`<img class="flagq" alt="">`:''}<div class="q"></div><div id="opts"></div><div id="fb"></div>`;
  app.querySelector('.q').textContent=q.q;
  if(q.flag)app.querySelector('.flagq').src='flags/'+q.flag+'.svg';
  const box=document.getElementById('opts');
  if(flagQ)box.className='flaggrid';
  sh(q.o).forEach(o=>{const b=document.createElement('button');b.className=flagQ?'opt flagopt':'opt';b.type='button';b.dataset.choice=String(o);
   if(flagQ&&o==='NONE')b.innerHTML='<span class="noflag">No national flag</span>';
   else if(flagQ){const img=document.createElement('img');img.src='flags/'+String(o).toLowerCase()+'.svg';img.alt='';b.appendChild(img);}
   else b.textContent=o;
   box.appendChild(b);});
  if(flagQ&&window.GeoMap&&GeoMap.card)GeoMap.card(document.getElementById('minimap'),id);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const got=b.dataset.choice;const ok=got==q.a;app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.choice==q.a)x.classList.add('ok')});
   if(ok){right++;streak++;S.best=Math.max(S.best,streak);save()}else{b.classList.add('no');streak=0}beep(ok);
   document.getElementById('fb').innerHTML=`<div class="fact">${ok?'✅ Correct!':'❌ Not quite.'} 💡 ${q.f}</div><button class="next">${i+1<qs.length?'Next →':'See result'}</button>`;
   app.querySelector('.next').onclick=()=>{i++;i<qs.length?show():result()}})};
 const result=()=>{const need=Math.ceil(qs.length*PASS),pass=right>=need;const first=pass&&!passed(id);if(pass){notePass(id);save();if(first)confetti(40)}
  app.innerHTML=`<div class="center"><div style="font-size:70px">${pass?'🔓':'🔒'}</div><div class="big">${pass?C.name+' unlocked!':'So close!'}</div><p>${lvl} · you got ${right}/${qs.length}. ${pass?(badge(id)+' is your best.'):'Need '+need+' to unlock.'}</p>
  <button class="next" id="a">${pass?'Back to '+C.cont:'Try again'}</button></div>`;
  document.getElementById('a').onclick=()=>{if(pass){stack.pop();continentOrWin(C.cont)}else quiz(id)}};show()}
function continentOrWin(c){if(nDone(GEO)==GEO.length){stack=[home];win()}else{stack.pop();go(()=>continent(c))}}
function confetti(n){for(let k=0;k<n;k++){const d=document.createElement('div');d.className='conf';d.style.left=Math.random()*100+'vw';d.style.background=`hsl(${Math.random()*360},90%,60%)`;d.style.animationDuration=1.5+Math.random()*2+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),4000)}}
function win(){$t.textContent='🏆 You did it!';confetti(150);app.innerHTML=`<div class="center" id="win"><div style="font-size:90px">🏆🌍</div><div class="big">World Conquered!</div><p>You unlocked all ${GEO.length} countries on every continent.</p><p>Best streak: 🔥 ${S.best}</p>
 <div class="levels" id="levels"><button type="button" data-l="easy">Easy<small>Landmarks and famous facts</small></button><button type="button" data-l="medium">Medium<small>The main quiz</small></button><button type="button" data-l="hard">Hard<small>Deeper history and culture</small></button></div>
 <button type="button" class="rand" id="rand-world">🎲 Random Country (anywhere)<small>Everything is unlocked. Replay any country.</small></button><button type="button" class="mapbtn" id="open-map">🗺️ World map<small>Tap a country to quiz it again</small></button><button class="next" id="again">Play again (reset)</button></div>`;
 document.querySelectorAll('#levels button').forEach(b=>{if(b.dataset.l===S.level)b.classList.add('on');b.onclick=()=>{S.level=b.dataset.l;save();win()}});
 document.getElementById('rand-world').onclick=()=>launchRandom(GEO);
 document.getElementById('open-map').onclick=()=>go(worldMap);
 document.getElementById('again').onclick=()=>{S.done={};save();home()}}
home();
</script></body></html>
